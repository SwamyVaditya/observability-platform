apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alertmanager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/SwamyVaditya/observability-platform.git'
    targetRevision: main
    path: apps/alertmanager/kustomize
    helm:
      releaseName: alertmanager
      values: |
        persistence:
          enabled: false   # ephemeral storage, no PVC needed for local demo

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

        service:
          type: ClusterIP
          port: 9093

        config:
          global:
            resolve_timeout: 5m
          route:
            group_by: ['alertname', 'service']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            receiver: 'webhook'
          receivers:
            - name: 'webhook'
              webhook_configs:
                - url: 'http://webhook-receiver.observability.svc.cluster.local:8080'
                  send_resolved: true
          inhibit_rules:
            - source_match:
                severity: 'critical'
              target_match:
                severity: 'warning'
              equal: ['alertname', 'service']
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
