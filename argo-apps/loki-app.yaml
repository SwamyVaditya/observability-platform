apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/SwamyVaditya/observability-platform.git'
    targetRevision: main
    path: apps/loki/kustomize
    helm:
      releaseName: loki
      values: |
        persistence:
          enabled: true
          size: 2Gi       # downsized PVC for local constraints
          storageClassName: standard

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi

        service:
          type: ClusterIP

        config:
          table_manager:
            retention_deletes_enabled: true
            retention_period: 7d   # keep logs for 7 days only

        ingester:
          lifecycler:
            ring:
              kvstore:
                store: inmemory
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
